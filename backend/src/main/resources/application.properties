spring.application.name=tally

server.address=127.0.0.1
server.port=8765

tally.data-dir=${TALLY_DATA_DIR:${FITLOCAL_DATA_DIR:./data}}
spring.datasource.url=jdbc:sqlite:${tally.data-dir}/tally.db?foreign_keys=true&busy_timeout=5000
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=64

tally.lm-studio.base-url=${LM_STUDIO_BASE_URL:http://127.0.0.1:1234/v1}
tally.lm-studio.model=${LM_STUDIO_MODEL:}
tally.lm-studio.timeout=180s

# Backend secrets and personal values live in the gitignored secrets.properties at the repo root (discord-ingest
# E12); its keys override the defaults below. Copy secrets.properties.example to start. Optional: no file, no secrets.
spring.config.import=optional:file:${TALLY_SECRETS_FILE:./secrets.properties}

# Discord log ingestion (discord-ingest §7). Off while the token is blank. Token, channel and users are secrets.
tally.ingest.discord.token=
tally.ingest.discord.channel-id=
tally.ingest.discord.allowed-user-ids=
tally.ingest.discord.lookback-days=14
tally.ingest.discord.start-after=
tally.ingest.discord.rescan-interval=15m
tally.ingest.timezone=
